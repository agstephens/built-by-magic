<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exponential Calculator</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --heading-color: #1a1a1a;
      --label-color: #555555;
      --border-color: #cccccd;
      --primary-color: #0066cc;
      --primary-hover: #0052a3;
      --nav-bg: #eef4fc;
      --nav-link: #0066cc;
      --nav-link-active: #004080;
      --result-bg: #eef6ff;
      --result-border: #b8daff;
      --error-bg: #fdf2f2;
      --error-border: #f8b4b4;
      --error-text: #9b1c1c;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --heading-color: #ffffff;
      --label-color: #bbbbbb;
      --border-color: #444444;
      --primary-color: #3182ce;
      --primary-hover: #2b6cb0;
      --nav-bg: #2d3748;
      --nav-link: #63b3ed;
      --nav-link-active: #90cdf4;
      --result-bg: #1a365d;
      --result-border: #2b6cb0;
      --error-bg: #63171b;
      --error-border: #9b2c2c;
      --error-text: #feb2b2;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .nav {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      background: var(--nav-bg);
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-sizing: border-box;
    }

    .nav a {
      color: var(--nav-link);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }

    .nav a.active {
      color: var(--nav-link-active);
      text-decoration: underline;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
      color: var(--heading-color);
      text-align: center;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--label-color);
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-color);
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .result-box {
      margin-top: 24px;
      padding: 16px;
      border-radius: 6px;
      background-color: var(--result-bg);
      border: 1px solid var(--result-border);
      text-align: center;
    }

    .result-box.error {
      background-color: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error-text);
    }

    .result-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--label-color);
      margin-bottom: 4px;
    }

    .result-value {
      font-size: 22px;
      font-weight: bold;
      color: var(--primary-color);
    }

    .result-box.error .result-value {
      color: var(--error-text);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="active">Calculator</a>
    <a href="settings.html">⚙ Settings</a>
  </nav>

  <div class="card">
    <h1>Exponential Calculator</h1>
    <form id="calc-form">
      <div class="form-group">
        <label for="base">Base Number</label>
        <input type="number" id="base" step="any" placeholder="e.g. 2" required>
      </div>
      <div class="form-group">
        <label for="exponent">Exponent</label>
        <input type="number" id="exponent" step="any" placeholder="e.g. 8" required>
      </div>
      <button type="submit" id="calculate-btn">Calculate</button>
    </form>
    <div id="result-container" class="result-box" style="display: none;">
      <div class="result-title">Result</div>
      <div id="result-value" class="result-value"></div>
    </div>
  </div>

  <script>
    const DEFAULT_SETTINGS = {
      theme: 'system',
      precision: 'auto',
      notation: 'standard',
      defaultBase: '',
      defaultExponent: '',
    };

    function loadSettings() {
      try {
        const saved = localStorage.getItem('app_settings');
        return saved ? { ...DEFAULT_SETTINGS, ...JSON.parse(saved) } : { ...DEFAULT_SETTINGS };
      } catch (e) {
        return { ...DEFAULT_SETTINGS };
      }
    }

    function applyTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      }
    }

    function calculatePower(base, exponent) {
      if (typeof base !== 'number' || isNaN(base) || !isFinite(base)) {
        throw new TypeError('Base must be a valid finite number.');
      }
      if (typeof exponent !== 'number' || isNaN(exponent) || !isFinite(exponent)) {
        throw new TypeError('Exponent must be a valid finite number.');
      }
      return Math.pow(base, exponent);
    }

    function formatResult(value, settings) {
      if (typeof value !== 'number' || isNaN(value)) {
        return String(value);
      }

      let formatted = value;

      if (settings.precision !== undefined && settings.precision !== 'auto') {
        const prec = parseInt(settings.precision, 10);
        if (!isNaN(prec)) {
          formatted = Number(value.toFixed(prec));
        }
      }

      if (settings.notation === 'scientific') {
        if (settings.precision !== undefined && settings.precision !== 'auto') {
          const prec = parseInt(settings.precision, 10);
          if (!isNaN(prec)) {
            return value.toExponential(prec);
          }
        }
        return value.toExponential();
      }

      return String(formatted);
    }

    const currentSettings = loadSettings();
    applyTheme(currentSettings.theme);

    if (currentSettings.defaultBase !== undefined && currentSettings.defaultBase !== '') {
      document.getElementById('base').value = currentSettings.defaultBase;
    }
    if (currentSettings.defaultExponent !== undefined && currentSettings.defaultExponent !== '') {
      document.getElementById('exponent').value = currentSettings.defaultExponent;
    }

    document.getElementById('calc-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const baseInput = document.getElementById('base').value;
      const exponentInput = document.getElementById('exponent').value;
      const resultContainer = document.getElementById('result-container');
      const resultValue = document.getElementById('result-value');

      try {
        const base = parseFloat(baseInput);
        const exponent = parseFloat(exponentInput);
        const res = calculatePower(base, exponent);
        const formattedRes = formatResult(res, currentSettings);
        resultContainer.className = 'result-box';
        resultValue.textContent = `${base} ^ ${exponent} = ${formattedRes}`;
        resultContainer.style.display = 'block';
      } catch (err) {
        resultContainer.className = 'result-box error';
        resultValue.textContent = err.message;
        resultContainer.style.display = 'block';
      }
    });
  </script>
</body>
</html>
