<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Built by magic</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 32px;
      width: 100%;
      max-width: 420px;
    }
    h1 {
      margin-top: 0;
      font-size: 24px;
      color: #1a1a1a;
      text-align: center;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
      color: #555;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #0066cc;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0052a3;
    }
    .result-box {
      margin-top: 24px;
      padding: 16px;
      border-radius: 6px;
      background-color: #eef6ff;
      border: 1px solid #b8daff;
      text-align: center;
    }
    .result-box.error {
      background-color: #fdf2f2;
      border-color: #f8b4b4;
      color: #9b1c1c;
    }
    .result-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #666;
      margin-bottom: 4px;
    }
    .result-value {
      font-size: 22px;
      font-weight: bold;
      color: #0066cc;
    }
    .result-box.error .result-value {
      color: #9b1c1c;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Exponential Calculator</h1>
    <form id="calc-form">
      <div class="form-group">
        <label for="base">Base Number</label>
        <input type="number" id="base" step="any" placeholder="e.g. 2" required>
      </div>
      <div class="form-group">
        <label for="exponent">Exponent</label>
        <input type="number" id="exponent" step="any" placeholder="e.g. 8" required>
      </div>
      <button type="submit" id="calculate-btn">Calculate</button>
    </form>
    <div id="result-container" class="result-box" style="display: none;">
      <div class="result-title">Result</div>
      <div id="result-value" class="result-value"></div>
    </div>
  </div>

  <script>
    function calculatePower(base, exponent) {
      if (typeof base !== 'number' || isNaN(base) || !isFinite(base)) {
        throw new TypeError('Base must be a valid finite number.');
      }
      if (typeof exponent !== 'number' || isNaN(exponent) || !isFinite(exponent)) {
        throw new TypeError('Exponent must be a valid finite number.');
      }
      return Math.pow(base, exponent);
    }

    document.getElementById('calc-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const baseInput = document.getElementById('base').value;
      const exponentInput = document.getElementById('exponent').value;
      const resultContainer = document.getElementById('result-container');
      const resultValue = document.getElementById('result-value');

      try {
        const base = parseFloat(baseInput);
        const exponent = parseFloat(exponentInput);
        const res = calculatePower(base, exponent);
        resultContainer.className = 'result-box';
        resultValue.textContent = `${base} ^ ${exponent} = ${res}`;
        resultContainer.style.display = 'block';
      } catch (err) {
        resultContainer.className = 'result-box error';
        resultValue.textContent = err.message;
        resultContainer.style.display = 'block';
      }
    });
  </script>
</body>
</html>
